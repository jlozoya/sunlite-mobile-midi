name: Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    # Pinned, not windows-latest. That label now resolves to windows-2025-vs2026,
    # and the node-gyp bundled with @electron/rebuild cannot detect Visual Studio
    # 2026, so rebuilding the native MIDI and SQLite modules fails with
    # "Could not find any Visual Studio installation to use". windows-2022 ships
    # a Visual Studio this node-gyp recognises. Revisit when @electron/rebuild
    # ships a node-gyp that knows VS2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The gyp bundled with @electron/rebuild's node-gyp still imports
      # distutils, which Python removed in 3.12. Without this the native
      # rebuild dies with "ModuleNotFoundError: No module named 'distutils'".
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: Point node-gyp at Python 3.11
        shell: pwsh
        run: echo "PYTHON=${{ steps.python.outputs.python-path }}" >> $env:GITHUB_ENV
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:updates
      - run: bun run test:automation
      - run: bun run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sunlite-windows
          if-no-files-found: error
          path: |
            release/*-Setup-*.exe
            release/*.blockmap
            release/latest.yml
